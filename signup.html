<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - VYPEXO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>Create an Account</h2>
  
  <form id="signupForm">
    <div>
      <label for="fullName">Full Name:</label><br>
      <input type="text" id="fullName" required placeholder="Enter your full name">
    </div>
    <br>
    <div>
      <label for="email">Email:</label><br>
      <input type="email" id="email" required placeholder="Enter your email">
    </div>
    <br>
    <div>
      <label for="password">Password:</label><br>
      <input type="password" id="password" required placeholder="Enter password">
    </div>
    <br>
    <div>
      <label for="role">Account Type:</label><br>
      <select id="role" required>
        <option value="buyer">Buyer (Kreta)</option>
        <option value="seller">Seller (Bikreta)</option>
      </select>
    </div>
    <br>
    <button type="submit">Sign Up</button>
  </form>

  <script>
    const SUPABASE_URL = 'https://naidbmtqwckrwxioibea.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VlMCQAHqYujmr9uqVSKoag_yOjrDH4Q';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleSignup(email, password, role, fullName) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        alert("Signup failed: " + error.message);
        return;
      }

      if (data.user) {
        const { error: profileError } = await supabase
          .from('profiles')
          .insert([
            { id: data.user.id, email: email, full_name: fullName, role: role }
          ]);

        if (profileError) {
          console.error("Profile save error:", profileError);
          alert("Error saving profile details.");
        } else {
          alert("Signup successful!");
          window.location.href = "login.html";
        }
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      await handleSignup(email, password, role, fullName);
    });
  </script>

</body>
</html>
