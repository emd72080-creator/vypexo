<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Create account | VYPEXO</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="signup.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <header class="brand">
      <div class="brand-name">VYPEXO</div>
      <p class="brand-tagline">Find it. Love it. Make it yours.</p>
    </header>
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Create your account</h1>
      <p class="intro">Join VYPEXO in just a few steps.</p>
      <form id="signupForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password (at least 8 characters)</label>
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="role">I want to</label>
          <select id="role" name="role" required>
            <option value="buyer">Shop as a buyer</option>
            <option value="seller">Request seller access</option>
          </select>
        </div>
        <button id="signupButton" type="submit">Create account</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <p class="note">Seller access may require review. Choosing seller does not grant admin or seller permissions automatically.</p>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
