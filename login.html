<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Log in | VYPEXO</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <header class="brand">
      <div class="brand-name">VYPEXO</div>
      <p class="brand-tagline">Your next favorite find starts here.</p>
    </header>
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Welcome back</h1>
      <p class="intro">Log in to continue to your account.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="loginButton" type="submit">Log in</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footer">New to VYPEXO? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
