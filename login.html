
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VYPEXO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Login to VYPEXO</h1>

  <form id="loginForm">
    <label for="email">Email</label><br>
    <input id="email" type="email" autocomplete="email" required>
    <br><br>

    <label for="password">Password</label><br>
    <input id="password" type="password"
      autocomplete="current-password" required>
    <br><br>

    <button id="loginButton" type="submit">Login</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>

  <p>Don't have an account? <a href="signup.html">Sign up</a></p>

  <script>
    const SUPABASE_URL =
      'https://naidbmtqwckrwxioibea.supabase.co';
    const SUPABASE_ANON_KEY =
      'sb_publishable_VlMCQAHqYujmr9uqVSKoag_yOjrDH4Q';

    const { createClient } = window.supabase;
    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      button.disabled = true;
      message.textContent = 'Logging in...';

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;
        if (!data.user) throw new Error('Login could not be verified.');

        const { data: profile, error: profileError } =
          await supabaseClient
            .from('profiles')
            .select('role')
            .eq('id', data.user.id)
            .maybeSingle();

        if (profileError) {
          throw new Error(
            'Could not load your profile. Check the profiles table and permissions.'
          );
        }

        const role = profile?.role || 'buyer';

        if (role === 'admin') {
          window.location.href = 'admin.html';
        } else if (role === 'seller') {
          window.location.href = 'seller-dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (error) {
        console.error('Login error:', error);
        message.textContent = error.message || 'Login failed.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
